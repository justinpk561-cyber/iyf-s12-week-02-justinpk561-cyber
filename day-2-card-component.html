
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - card component</title>
</head>
    <body>
        <div class="card">
            <img
                src="https://via.placeholder.com/300"a
                alt="Card image">

            <div class="card-content">
                <h2>Day 2 - card component</h2>
     <P>this is a card component example</P>
                <button>Learn more</button>
            </div>
            <style>
                .card {
                    width: 300px;
                    background-color: white;
                    border-radius: 1px;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    overflow: hidden;
                    margin: 20px;
                    padding: 20px;
                } 

                .card img {+
                     
                    width: 100%;
                    height: 200px;
                    object-fit: cover;
                }
                .card-content {
                    padding: 20px;
                }
                .card-content h2 {
                    margin-bottom: 15px;
                    color: #333;
                }
                .card-content p {
                    color: #666;
                    line-height: 1.5;
                }
                .card button {
                    background-color: #007bff;
                    color: white;
                    border: none;
                    padding: 10px 15px;
                    border-radius: 5px;
                    cursor: pointer;
                }
                .card button:hover{
                    background-color: #0056b3;
                }
            </style>
    </body>
</html>
