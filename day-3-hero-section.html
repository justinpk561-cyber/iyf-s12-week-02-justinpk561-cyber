<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.hero {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    color: white;
}

.hero-content h1 {
    font-size: 3rem;
    margin-bottom: 20px;
}

.hero-content p {
    font-size: 1.2rem;
    margin-bottom: 30px;
}

.hero-btn {
    display: inline-block;
    padding: 12px 30px;
    background: white;
    color: #764ba2;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.hero-btn:hover {
    background: #eeeeee;
}
    </style>
    <title>My Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to My Website</h1>

            <p>
                Discover something amazing with here
            </p>

            <a href="#" class="hero-btn">Get Started</a>
        </div>
    </section>

</body>
</html>
